<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>晨屿 · 收藏当前网页</title>
  <link rel="stylesheet" href="widgets/favorites.css">
</head>
<body class="favorites-popup">
  <header class="favorites-popup-head">
    <span class="favorites-popup-brand"><img src="assets/icon32.png" width="25" height="25" alt=""><strong>晨屿</strong></span>
    <button class="favorites-secondary" type="button" id="open-daybreak">打开启动页 <span aria-hidden="true">↗</span></button>
  </header>
  <main>
    <h1>收藏当前网页</h1>
    <p class="favorites-popup-domain" id="page-domain"></p>
    <form id="save-page" class="favorites-form">
      <label class="favorites-label">显示名称
        <input class="favorites-field" id="page-title" maxlength="200" autocomplete="off" placeholder="使用网页标题">
      </label>
      <label class="favorites-label">分组
        <input class="favorites-field" id="page-folder" maxlength="80" autocomplete="off" placeholder="可选，例如 工作">
      </label>
      <button class="favorites-primary" id="save-favorite" type="submit" disabled>添加到收藏</button>
    </form>
    <p class="favorites-message" id="popup-status" role="status"></p>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
