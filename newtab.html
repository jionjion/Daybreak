<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>晨屿</title>
  <link rel="icon" href="assets/icon32.png">
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/baskervville-latin.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/instrument-sans-latin.woff2" crossorigin>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="shared/modal.css">
  <link rel="stylesheet" href="widgets/bookmarks.css">
  <link rel="stylesheet" href="widgets/library.css">
  <link rel="stylesheet" href="widgets/weather.css">
  <link rel="stylesheet" href="widgets/settings.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="widgets/home.css">
  <link rel="stylesheet" href="widgets/wallpapers.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div id="wall-layer" class="wall-layer" aria-hidden="true"></div>
  <script src="boot.js"></script>
  <a class="skip" href="#main">跳到主要内容</a>
  <main id="main" class="frame main" tabindex="-1">
    <section id="home-view" aria-label="今日">
      <nav id="quick-strip" aria-label="浏览器快捷栏"></nav>
      <div class="hero" id="hero" data-theme="lake">
        <div class="hero-inner">
          <p class="hero-date" id="hero-date"></p>
          <a id="home-weather" class="home-weather" href="#settings/weather" hidden></a>
          <h1 class="time" aria-label="当前时间"><time id="time"></time><span id="period"></span></h1>
          <div class="search-block">
            <form id="search-form" class="search-form" role="search" novalidate>
              <button id="engine-button" class="engine-button" type="button" aria-label="切换搜索引擎" aria-haspopup="true" aria-expanded="false" title="切换搜索引擎"></button>
              <input id="query" type="text" autocomplete="off" placeholder="搜索或输入网址" aria-label="搜索或输入网址" required>
            </form>
            <div class="search-foot">
              <div id="search-categories"></div>
            </div>
          </div>
        </div>
        <p class="wall-message" role="status"></p>
      </div>
      <div id="system-shortcuts" aria-label="内置工具"></div>
      <section class="bookmarks-band" aria-label="浏览器书签">
        <div id="bookmarks-compact"></div>
      </section>
    </section>
    <div class="wall-actions"><button id="wall-next" type="button" aria-label="刷新壁纸" title="刷新壁纸"><i data-icon="rotate"></i></button><a class="hero-edit" href="#settings/wallpaper" aria-label="更换壁纸" title="更换壁纸"><i data-icon="image"></i></a><a class="hero-edit" href="#settings" aria-label="个人设置" title="个人设置"><i data-icon="settings"></i></a></div>
    <section id="detail-view" aria-labelledby="detail-title" hidden>
      <div class="page-head"><div class="page-crumb"><a href="#home"><i data-icon="left"></i>返回今日</a></div><h1 id="detail-title"></h1></div>
      <div id="detail-content"></div>
    </section>
    <div id="settings-scrim" class="settings-scrim" aria-hidden="true"></div>
    <section id="settings-view" class="settings-drawer" role="dialog" aria-modal="true" aria-labelledby="settings-title" tabindex="-1">
      <div class="settings-drawer-top">
        <header class="settings-drawer-head">
          <div>
            <p class="settings-drawer-kicker">Daybreak</p>
            <h1 id="settings-title">个人设置</h1>
          </div>
        </header>
        <nav id="settings-index" aria-label="设置分类"></nav>
      </div>
      <div id="settings-scroll" class="settings-drawer-body">
        <div id="settings-content"></div>
        <div id="layout-options" class="settings-panel"></div>
        <div id="more-preferences" class="settings-panel"><section id="wallpaper-collections" class="settings-card"></section></div>
      </div>
    </section>
  </main>
</body>
</html>
